name: Actualitzar EPG Historic

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositori
      uses: actions/checkout@v4

    - name: Instal·lar dependències
      run: |
        python3 -m pip install --upgrade pip --break-system-packages || true
        python3 -m pip install requests --break-system-packages || python3 -m pip install requests

    - name: Executar script d'actualització
      run: python3 actualizar_epg.py

    - name: Pujar canvis al repositori
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add epg_historic.xml.gz
        if git diff --staged --quiet; then
          echo "Sense canvis per fer commit"
        else
          git commit -m "Actualització automàtica EPG: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
        fi
